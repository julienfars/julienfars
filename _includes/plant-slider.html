{% include base_path %}

{% if include.id %}
  {% assign gallery = page.[include.id] %}
{% else %}
  {% assign gallery = page.gallery %}
{% endif %}

{% assign slider_id = page.url | slugify %}

<div class="jf-slider" id="jf-slider-{{ slider_id }}" data-count="{{ gallery.size }}">
  <div class="jf-slider__track">
    {% for img in gallery %}
      <div class="jf-slider__slide">
        <img src="{{ img.image_path | prepend: "/images/" | prepend: base_path }}" alt="{{ img.alt | default: "Plant photo" }}">
        {% if img.alt %}<div class="jf-slider__caption">{{ img.alt }}</div>{% endif %}
      </div>
    {% endfor %}
  </div>
  <button type="button" class="jf-slider__btn jf-slider__btn--prev" aria-label="Previous photo">&#8249;</button>
  <button type="button" class="jf-slider__btn jf-slider__btn--next" aria-label="Next photo">&#8250;</button>
  <div class="jf-slider__meta">
    <span class="jf-slider__count"></span>
    <div class="jf-slider__dots"></div>
  </div>
</div>

<style>
  .jf-slider { position: relative; margin: 1.5em 0; user-select: none; }
  .jf-slider__track {
    display: flex;
    overflow: hidden;
    border-radius: 8px;
    background: #111;
    touch-action: pan-y;
  }
  .jf-slider__track.jf-slider__track--animate { transition: transform 0.35s ease; }
  .jf-slider__slide { flex: 0 0 100%; position: relative; }
  .jf-slider__slide img {
    width: 100%;
    height: 60vh;
    max-height: 520px;
    object-fit: contain;
    background: #111;
    display: block;
  }
  .jf-slider__caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.5em 0.9em;
    font-size: 0.85em;
    color: #f0f0f0;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
  }
  .jf-slider__btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.45);
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.4em;
    line-height: 1;
    cursor: pointer;
  }
  .jf-slider__btn:hover { background: rgba(0,0,0,0.7); }
  .jf-slider__btn--prev { left: 10px; }
  .jf-slider__btn--next { right: 10px; }
  .jf-slider__meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75em;
    margin-top: 0.6em;
  }
  .jf-slider__count { font-size: 0.8em; color: #8b8b8b; }
  .jf-slider__dots { display: flex; gap: 6px; }
  .jf-slider__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c3c3c3; border: none; padding: 0; cursor: pointer;
  }
  .jf-slider__dot.is-active { background: #6b7cff; }
</style>

<script>
(function () {
  var root = document.getElementById("jf-slider-{{ slider_id }}");
  if (!root) return;
  var track = root.querySelector(".jf-slider__track");
  var slides = root.querySelectorAll(".jf-slider__slide");
  var count = slides.length;
  if (count === 0) return;

  var dotsWrap = root.querySelector(".jf-slider__dots");
  var countEl = root.querySelector(".jf-slider__count");
  var prevBtn = root.querySelector(".jf-slider__btn--prev");
  var nextBtn = root.querySelector(".jf-slider__btn--next");
  var index = 0;
  var dots = [];

  for (var i = 0; i < count; i++) {
    var dot = document.createElement("button");
    dot.type = "button";
    dot.className = "jf-slider__dot";
    dot.setAttribute("aria-label", "Go to photo " + (i + 1));
    (function (target) {
      dot.addEventListener("click", function () { goTo(target); });
    })(i);
    dotsWrap.appendChild(dot);
    dots.push(dot);
  }

  function render() {
    track.style.transform = "translateX(-" + (index * 100) + "%)";
    countEl.textContent = (index + 1) + " / " + count;
    dots.forEach(function (d, i) { d.classList.toggle("is-active", i === index); });
  }

  function goTo(i) {
    index = (i + count) % count;
    render();
  }

  track.classList.add("jf-slider__track--animate");
  prevBtn.addEventListener("click", function () { goTo(index - 1); });
  nextBtn.addEventListener("click", function () { goTo(index + 1); });

  root.setAttribute("tabindex", "0");
  root.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") goTo(index - 1);
    if (e.key === "ArrowRight") goTo(index + 1);
  });

  var startX = null;
  track.addEventListener("pointerdown", function (e) { startX = e.clientX; });
  track.addEventListener("pointerup", function (e) {
    if (startX === null) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 40) goTo(index + (dx < 0 ? 1 : -1));
    startX = null;
  });

  render();
})();
</script>
